# LOCAL DOCKER STACK ONLY — reverse proxy so the app can talk to
# http://127.0.0.1:54321/rest/v1/<table> exactly like it would talk to a real
# Supabase project (supabase-js always calls `${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/...`).
# Strips the /rest/v1 prefix and forwards everything else to PostgREST's root.
server {
  listen 80;

  # PostgREST lives at the container's root — strip the /rest/v1 prefix.
  location /rest/v1/ {
    rewrite ^/rest/v1/?(.*)$ /$1 break;
    proxy_pass http://weemap-local-rest:3000;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
  }

  location = /rest/v1 {
    proxy_pass http://weemap-local-rest:3000/;
    proxy_set_header Host $host;
  }

  # Storage isn't part of this local stack. Return a graceful 404 instead of
  # a connection error so any accidental storage call fails predictably.
  location /storage/v1/ {
    return 404 '{"error":"local stack has no storage service"}';
    default_type application/json;
  }

  location / {
    return 404 '{"error":"not found"}';
    default_type application/json;
  }
}
